<script>
    async function ask() {
        const prompt = document.getElementById('prompt').value;
        const result = document.getElementById('result');
        result.textContent = 'بیردەکەمەوە...';
        
        try {
            const res = await fetch('/api/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ prompt })
            });
            
            // پشکنینی status
            if (!res.ok) {
                const errorText = await res.text();
                result.textContent = 'هەڵەی ڕاژە: ' + res.status + '\n' + errorText;
                return;
            }
            
            const data = await res.json();
            if (data.response) {
                result.textContent = data.response;
            } else {
                result.textContent = 'هەڵە: ' + JSON.stringify(data);
            }
        } catch (err) {
            result.textContent = 'هەڵەی چاوەڕواننەکراو: ' + err.message;
        }
    }
</script>
